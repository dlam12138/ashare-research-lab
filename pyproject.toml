[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-research"
version = "0.1.0"
description = "本地A股研究平台 — 免费数据底座"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=12.0",
    "duckdb>=0.9.0",
    "baostock>=0.8.8",
    "akshare>=1.14.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.13.2",
]

[project.scripts]
ashare-research = "ashare_research.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
