name: M3 Stage 3C-A-R2 digest identity

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  clean-clone:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Build M3 Stage 3C-A-R2 digest identity envelope
        run: python -m ashare_research.tools.m3_stage3car2_digest_probe --output tmp/stage3car2-digest-identity-${{ matrix.platform }}-${{ github.sha }}.json
      - name: Upload M3 Stage 3C-A-R2 digest identity envelope
        uses: actions/upload-artifact@v4
        with:
          name: stage3car2-digest-identity-${{ matrix.platform }}-${{ github.sha }}
          path: tmp/stage3car2-digest-identity-${{ matrix.platform }}-${{ github.sha }}.json
          if-no-files-found: error

  identity-compare:
    runs-on: ubuntu-latest
    needs: clean-clone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: stage3car2-digest-identity-ubuntu-${{ github.sha }}
          path: tmp/stage3car2-digest-ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: stage3car2-digest-identity-windows-${{ github.sha }}
          path: tmp/stage3car2-digest-windows
      - name: Compare exact M3 digest identity fields and payloads
        run: |
          python -m ashare_research.tools.m3_stage3car2_digest_probe --compare \
            tmp/stage3car2-digest-ubuntu/stage3car2-digest-identity-ubuntu-${{ github.sha }}.json \
            tmp/stage3car2-digest-windows/stage3car2-digest-identity-windows-${{ github.sha }}.json
