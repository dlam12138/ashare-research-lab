name: M3 Stage 3C-C pre-robustness lock

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  clean-clone:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run Stage 3C-C synthetic boundary gates
        run: >-
          python -m pytest -q tests/test_m3_stage3cc_preexecution.py
          tests/test_m3_stage3cb_preexecution.py
          tests/test_m3_stage3ca_pipeline.py
          tests/test_m3_stage3car2_digest_portability.py
      - name: Run static gates
        run: |
          python -m ruff check src tests
          python -m compileall -q src tests
      - name: Build Stage 3C-C pre-robustness identity envelope
        run: >-
          python -c "import json; from pathlib import Path; from ashare_research.tools.m3_stage3cb_development import verify_frozen_lock,verify_adapter_lock; from ashare_research.tools.m3_stage3cc_registered_robustness import build_robustness_execution_digest,EXPECTED_DATA_MANIFEST_DIGEST,EXPECTED_MODEL_DIGEST; d,p=build_robustness_execution_digest(data_manifest_digest=EXPECTED_DATA_MANIFEST_DIGEST,model_digest=EXPECTED_MODEL_DIGEST); root=Path.cwd(); value={'identity':verify_frozen_lock(),'execution_adapter_digest':verify_adapter_lock(),'robustness_execution_digest':d,'robustness_execution_digest_payload':p,'holdout_read':False,'real_robustness_read':False}; (root/'tmp').mkdir(exist_ok=True); (root/'tmp'/'stage3cc-preexecution-${{ matrix.platform }}-${{ github.sha }}.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n',encoding='utf-8')"
      - name: Upload Stage 3C-C pre-robustness identity envelope
        uses: actions/upload-artifact@v4
        with:
          name: stage3cc-preexecution-${{ matrix.platform }}-${{ github.sha }}
          path: tmp/stage3cc-preexecution-${{ matrix.platform }}-${{ github.sha }}.json
          if-no-files-found: error

  identity-compare:
    runs-on: ubuntu-latest
    needs: clean-clone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: stage3cc-preexecution-ubuntu-${{ github.sha }}
          path: tmp/stage3cc-preexecution-ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: stage3cc-preexecution-windows-${{ github.sha }}
          path: tmp/stage3cc-preexecution-windows
      - name: Compare exact Stage 3C-C pre-robustness identities
        run: >-
          python -c "import json; from pathlib import Path; a=json.loads(next((Path('tmp/stage3cc-preexecution-ubuntu').glob('*.json'))).read_text()); b=json.loads(next((Path('tmp/stage3cc-preexecution-windows').glob('*.json'))).read_text()); assert a==b, 'M3_STAGE3CC_PREEXECUTION_IDENTITY_MISMATCH'; assert a['holdout_read'] is False and a['real_robustness_read'] is False; print('M3_STAGE3CC_PREEXECUTION_IDENTITY_MATCH')"
