name: M3 Stage 3D-B pre-unseal holdout lock

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  clean-clone:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run Stage 3D-B synthetic pre-unseal tests
        run: >-
          python -m pytest -q tests/test_m3_stage3db_preunseal.py
          tests/test_m3_stage3da_contract.py
          tests/test_m3_stage3cc_preexecution.py
          tests/test_m3_stage3cb_preexecution.py
          tests/test_m3_stage3ca_pipeline.py
          tests/test_m3_stage3car2_digest_portability.py
      - name: Run static gates
        run: |
          python -m ruff check src tests
          python -m compileall -q src tests
      - name: Run fail-closed pre-unseal validator
        run: >-
          python -m ashare_research.tools.m3_stage3db_preunseal_check verify-contracts
          --output tmp/m3-stage3db-preunseal-${{ matrix.platform }}-${{ github.sha }}.json
      - name: Upload pre-unseal readiness envelope
        uses: actions/upload-artifact@v4
        with:
          name: m3-stage3db-preunseal-${{ matrix.platform }}-${{ github.sha }}
          path: tmp/m3-stage3db-preunseal-${{ matrix.platform }}-${{ github.sha }}.json
          if-no-files-found: error

  identity-compare:
    runs-on: ubuntu-latest
    needs: clean-clone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: m3-stage3db-preunseal-ubuntu-${{ github.sha }}
          path: tmp/m3-stage3db-preunseal-ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: m3-stage3db-preunseal-windows-${{ github.sha }}
          path: tmp/m3-stage3db-preunseal-windows
      - name: Compare exact cross-platform pre-unseal identities
        run: >-
          python -c "import json; from pathlib import Path; a=json.loads(next(Path('tmp/m3-stage3db-preunseal-ubuntu').glob('*.json')).read_text()); b=json.loads(next(Path('tmp/m3-stage3db-preunseal-windows').glob('*.json')).read_text()); assert a==b, 'M3_STAGE3DB_PREUNSEAL_IDENTITY_MISMATCH'; assert a['holdout_read'] is False and a['holdout_download'] is False and a['stage3db_status']=='PRE_UNSEAL_READY'; print('M3_STAGE3DB_PREUNSEAL_IDENTITY_MATCH')"
