name: Stage 2G reproducibility

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  clean-clone:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        short: [ubuntu, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Clean-clone and offline-input preflight
        run: python -m ashare_research.tools.stage2g_reproducibility verify-clean-clone
      - name: Static and import gates
        run: |
          ruff check src/ tests/
          python -m compileall -q src
      - name: Contract gate
        run: python -m ashare_research.tools.stage2g_reproducibility verify-contracts
      - name: Stage 2H.1 risk-veto PIT/lineage contract gate
        run: python -m ashare_research.tools.petrochina_risk_veto_vertical_slice verify-contracts
      - name: Build isolated test capsule A
        run: python -m ashare_research.tools.stage2g_reproducibility build-test-capsule --output tmp/stage2g2-ci/capsule-a
      - name: Build isolated test capsule B
        run: python -m ashare_research.tools.stage2g_reproducibility build-test-capsule --output tmp/stage2g2-ci/capsule-b
      - name: Compare independent capsule builds
        run: python -m ashare_research.tools.stage2g_reproducibility compare-capsules --left tmp/stage2g2-ci/capsule-a --right tmp/stage2g2-ci/capsule-b
      - name: Run capsule A and verify artifacts
        run: |
          python -m ashare_research.tools.stage2g_reproducibility run-test-capsule --capsule-dir tmp/stage2g2-ci/capsule-a --output tmp/stage2g2-ci/run-a --run-id stage2g2_test_capsule_a
          python -m ashare_research.tools.stage2g_reproducibility verify-artifacts --run-dir tmp/stage2g2-ci/run-a/stage2g2_test_capsule_a
      - name: Run capsule B and verify artifacts
        run: |
          python -m ashare_research.tools.stage2g_reproducibility run-test-capsule --capsule-dir tmp/stage2g2-ci/capsule-b --output tmp/stage2g2-ci/run-b --run-id stage2g2_test_capsule_a
          python -m ashare_research.tools.stage2g_reproducibility verify-artifacts --run-dir tmp/stage2g2-ci/run-b/stage2g2_test_capsule_a
      - name: Compare independent capsule runs
        run: python -m ashare_research.tools.stage2g_reproducibility compare-runs --left tmp/stage2g2-ci/run-a/stage2g2_test_capsule_a --right tmp/stage2g2-ci/run-b/stage2g2_test_capsule_a
      - name: Stage 2H.1 synthetic risk capsule A
        run: python -m ashare_research.tools.petrochina_risk_veto_vertical_slice run-test-capsule --output tmp/stage2h-ci/run-a --run-id stage2h_test_capsule
      - name: Stage 2H.1 synthetic risk capsule B
        run: python -m ashare_research.tools.petrochina_risk_veto_vertical_slice run-test-capsule --output tmp/stage2h-ci/run-b --run-id stage2h_test_capsule
      - name: Compare Stage 2H.1 synthetic risk capsules
        run: python -m ashare_research.tools.petrochina_risk_veto_vertical_slice compare-runs --left tmp/stage2h-ci/run-a/stage2h_test_capsule --right tmp/stage2h-ci/run-b/stage2h_test_capsule
      - name: Full offline test suite
        run: pytest -q
      - name: Build identity fingerprint
        run: python -m ashare_research.tools.m2_stage2k1r4c1_identity_diagnose fingerprint --output tmp/identity-fingerprint-${{ matrix.short }}.json
      - name: Upload identity fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: identity-fingerprint-${{ matrix.short }}
          path: tmp/identity-fingerprint-${{ matrix.short }}.json
          if-no-files-found: error

  identity-compare:
    runs-on: ubuntu-latest
    needs: clean-clone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: identity-fingerprint-ubuntu
          path: tmp/fp-ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: identity-fingerprint-windows
          path: tmp/fp-windows
      - name: Compare cross-platform identity fingerprints
        run: |
          python -m ashare_research.tools.m2_stage2k1r4c1_identity_diagnose compare \
            tmp/fp-ubuntu/identity-fingerprint-ubuntu.json \
            tmp/fp-windows/identity-fingerprint-windows.json
