name: Stage 2G reproducibility

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  clean-clone:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Static and import gates
        run: |
          ruff check src/ tests/
          python -m compileall -q src
      - name: Contract gate
        run: python -m ashare_research.tools.stage2g_reproducibility verify-contracts
      - name: Build isolated test capsule
        run: python -m ashare_research.tools.stage2g_reproducibility build-test-capsule --output .stage2g2-capsule
      - name: Run capsule twice and verify artifacts
        run: |
          python -m ashare_research.tools.stage2g_reproducibility run-test-capsule --capsule-dir .stage2g2-capsule
          python -m ashare_research.tools.stage2g_reproducibility run-test-capsule --capsule-dir .stage2g2-capsule
          python -m ashare_research.tools.stage2g_reproducibility verify-artifacts --run-dir .stage2g2-capsule/runs/stage2g2_test_capsule
      - name: Full offline test suite
        run: pytest -q
